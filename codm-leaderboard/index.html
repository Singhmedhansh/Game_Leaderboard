<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CODM Event Leaderboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>CODM Event Leaderboard</h1>
        <p class="sub">Mobile-first, live-friendly leaderboard for Call of Duty: Mobile events.</p>
        <div class="prompt-row">
          <input id="prompt" placeholder="Paste prompt or event name..." />
          <button id="applyPrompt">Apply</button>
        </div>
      </header>

      <section class="controls">
        <input id="teamName" placeholder="Team name" />
        <button id="addTeam">Add Team</button>
      </section>

      <section class="leaderboard">
        <h2>Leaderboard</h2>
        <ul id="teams"></ul>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
